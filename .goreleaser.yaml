# Release builds: `git tag v1.2.3 && git push --tags` runs this via
# .github/workflows/release.yml. Test locally with: goreleaser release --snapshot --clean
version: 2
project_name: ttywx

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ignore:
      - { goos: freebsd, goarch: arm64 }
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/j4mes/ttywx/api.Version={{ .Tag }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs", "^test", "^ci"]
